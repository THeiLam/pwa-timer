<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PWA Timer</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
  <meta name="theme-color" content="#111111">
</head>
<body>
  <main class="container">
    <h1>Timer</h1>

    <div class="inputs">
      <label>
        Total (min)
        <input type="number" id="totalMin" min="1" value="30">
      </label>

      <label>
        Interval (s)
        <input type="number" id="intervalSec" min="1" value="30">
      </label>
    </div>

    <div id="timeDisplay" class="time-display">30:00</div>
    <div id="intervalDisplay" class="interval-display">
      Next beep in: 30s
    </div>

    <div class="controls">
      <button id="startBtn">Start</button>
      <button id="pauseBtn" disabled>Pause</button>
      <button id="resetBtn">Reset</button>
    </div>

    <p class="hint">
      The timer continues counting based on real time.
    </p>
  </main>

  <audio id="startSound" preload="auto">
    <source src="./sounds/start.mp3" type="audio/mpeg">
  </audio>

  <audio id="beepSound" preload="auto">
    <source src="./sounds/beep.mp3" type="audio/mpeg">
  </audio>

  <audio id="stopSound" preload="auto">
    <source src="./sounds/stop.mp3" type="audio/mpeg">
  </audio>

  <script src="./app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
