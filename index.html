<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">

  <title>PWA Timer</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="container">
    <h1>Timer</h1>

    <div class="inputs">
      <label>
        Total (min)
        <input
          id="totalMin"
          type="number"
          min="1"
          value="30"
          inputmode="numeric"
        >
      </label>

      <label>
        Interval (s)
        <input
          id="intervalSec"
          type="number"
          min="1"
          value="30"
          inputmode="numeric"
        >
      </label>
    </div>

    <div id="timeDisplay" class="time-display">30:00</div>

    <div id="intervalDisplay" class="interval-display">
      Next beep in: 30s
    </div>

    <div class="controls">
      <button id="startBtn" type="button">Start</button>
      <button id="pauseBtn" type="button" disabled>Pause</button>
      <button id="resetBtn" type="button">Reset</button>
    </div>

    <p class="hint">
      Start sound plays first. The countdown begins when it ends.
    </p>
  </main>

  <!-- One reusable audio player: important for iPhone Safari compatibility -->
  <audio id="soundPlayer" preload="auto" playsinline></audio>

  <script src="./app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
